[project]
name = "jobhunt-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "cryptography>=43",
  "jobhunt-domain",
  "jobhunt-connectors",
  "jobhunt-agents",
  "jobhunt-policy",
  "jobhunt-tailoring",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobhunt_api"]

[tool.hatch.metadata]
allow-direct-references = true
