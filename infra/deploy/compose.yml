services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: jobhunt
      POSTGRES_DB: jobhunt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../supabase/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001.sql:ro
      - ../../supabase/migrations/002_source_health.sql:/docker-entrypoint-initdb.d/002.sql:ro
      - ../../supabase/migrations/003_operations_hardening.sql:/docker-entrypoint-initdb.d/003.sql:ro
      - ../../supabase/migrations/004_production_gates.sql:/docker-entrypoint-initdb.d/004.sql:ro
      - ../../supabase/migrations/005_uat_signoff_controls.sql:/docker-entrypoint-initdb.d/005.sql:ro

  api:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.api
    env_file:
      - .env.uat.example
    environment:
      DATABASE_URL: postgresql://jobhunt:jobhunt@postgres:5432/jobhunt
      AUTH_MODE: test
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.worker
    env_file:
      - .env.uat.example
    environment:
      DATABASE_URL: postgresql://jobhunt:jobhunt@postgres:5432/jobhunt
      AUTH_MODE: test
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.web
    ports:
      - "5173:80"

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:80"
    depends_on:
      - api
      - web

volumes:
  pgdata:
