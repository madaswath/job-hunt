[project]
name = "jobhunt-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jobhunt-api", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobhunt_worker"]

[tool.hatch.metadata]
allow-direct-references = true
